<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Integra UnB{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}"></head><body><a class="pular" href="#conteudo">Pular para conteúdo</a><header class="topo"><div class="barra"><a href="/" class="marca" aria-label="Integra UnB - início"><img src="{{ url_for('static',filename='logo-dgp.png') }}" alt="DGP - Decanato de Gestão de Pessoas"><span>Integra UnB<small>Comissão de Integração e Eventos</small></span></a><nav class="menu" aria-label="Navegação principal"><a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Início</a><a href="/programacao" {% if request.path in ['/programacao','/detalhes'] %}aria-current="page"{% endif %}>Programação</a><a href="/realizadas" {% if request.path == '/realizadas' %}aria-current="page"{% endif %}>Ações realizadas</a><a href="/documentos" {% if request.path == '/documentos' %}aria-current="page"{% endif %}>Documentos</a></nav></div></header><main id="conteudo">{% block content %}{% endblock %}</main><footer class="rodape">Integra UnB · Projeto demonstrativo · Comissão de Integração e Eventos do DGP/UnB<br>Informações e datas futuras sujeitas à confirmação institucional.</footer></body></html>
